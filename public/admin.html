<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ping, admin</title>
    <link rel="icon" type="image/svg+xml" href="/img/ping-logo.svg" />
    <link rel="icon" type="image/png" href="/img/ping-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <header class="barra">
      <a href="/painel" class="voltar">← Voltar pro painel</a>
      <span class="titulo-pagina">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /></svg>
        Moderação de temas
      </span>
    </header>

    <main id="palco">
      <p id="vazio" class="vazio" hidden>Nenhum tema esperando revisão.</p>
      <ul id="lista-pendentes" class="lista-pendentes"></ul>
    </main>

    <template id="modelo-pendente">
      <li class="tema-pendente">
        <div class="pendente-topo">
          <div>
            <strong class="pendente-titulo"></strong>
            <span class="pendente-meta"></span>
          </div>
          <div class="pendente-botoes">
            <button type="button" class="ver-perguntas">Ver perguntas</button>
            <button type="button" class="rejeitar">Rejeitar</button>
            <button type="button" class="aprovar">Aprovar</button>
          </div>
        </div>
        <p class="pendente-descricao"></p>
        <ol class="pendente-perguntas" hidden></ol>
      </li>
    </template>

    <script src="/js/admin.js"></script>
  </body>
</html>
